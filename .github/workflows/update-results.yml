name: Update Loto + EuroMillions results (FDJ)

on:
  schedule:
    - cron: "17 */2 * * *"
    # Soirs de tirage (lun, mar, mer, ven, sam) : passages rapprochés après 21 h (Paris)
    - cron: "7,37 19-23 * * 1,2,3,5,6"
    # Lendemain matin : rattrapage si l'archive FDJ a été publiée tard
    - cron: "23 5,6,7 * * 0,2,3,4,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest official results
        run: python3 scripts/update_fr.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add fr_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
